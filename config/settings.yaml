# ============================================================
# TRADING SYSTEM - CENTRAL CONFIGURATION
# ============================================================

project:
  name: "trading-system"
  version: "1.0.0"
  env: "development"  # development | production
  timezone: "Asia/Kolkata"
  python_package_root: "source_code"

# ------------------------------------------------------------
# DATA PROVIDER
# ------------------------------------------------------------
data_provider: "yfinance"  # yfinance | zerodha

# ------------------------------------------------------------
# MARKET UNIVERSE
# ------------------------------------------------------------
universe:
  indices:
    - "^NSEI"
    - "^NSEBANK"

  large_cap:
    - "RELIANCE.NS"
    - "TCS.NS"
    - "HDFCBANK.NS"
    - "INFY.NS"
    - "ICICIBANK.NS"
    - "HINDUNILVR.NS"
    - "SBIN.NS"
    - "BAJFINANCE.NS"
    - "BHARTIARTL.NS"
    - "KOTAKBANK.NS"

  watchlist:
    - "TATAMOTORS.NS"
    - "WIPRO.NS"
    - "AXISBANK.NS"

# ------------------------------------------------------------
# HISTORICAL DATA SETTINGS
# ------------------------------------------------------------
historical:
  default_period: "2y"
  default_interval: "1d"
  start_date: "2022-01-01"
  end_date: null

# ------------------------------------------------------------
# PATHS - all runtime paths must come from config
# ------------------------------------------------------------
paths:
  project_root: "."
  source_code_dir: "Source Code"
  config_dir: "config"
  data_dir: "data"
  raw_data_dir: "data/raw"
  bronze_data_dir: "data/bronze"
  silver_data_dir: "data/silver"
  gold_data_dir: "data/gold"
  charts_dir: "data/charts"
  cache_dir: "data/cache"
  sessions_dir: "data/sessions"
  instrument_cache_dir: "data/cache/instruments"
  input_dir: "data/input"
  watchlist_file: "data/input/watchlist.csv"
  session_file: "data/sessions/kite_session.json"
  logs_dir: "logs"

# ------------------------------------------------------------
# AUTH / SESSION CONFIG
# ------------------------------------------------------------
auth:
  zerodha:
    enabled: false
    session_refresh_hour: "06:00"
    session_file: "data/sessions/kite_session.json"

# ------------------------------------------------------------
# INDICATORS
# ------------------------------------------------------------
indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2
  atr_period: 14
  sma_periods: [20, 50, 100]
  ema_periods: [9, 21, 55]

# ------------------------------------------------------------
# ZERODHA
# ------------------------------------------------------------
zerodha:
  api_key: ""
  api_secret: ""
  user_id: ""
  password: ""
  totp_key: ""
  redirect_url: "https://127.0.0.1:5000/"
